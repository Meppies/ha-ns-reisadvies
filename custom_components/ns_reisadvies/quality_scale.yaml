# Integration quality scale tracking — see
# https://developers.home-assistant.io/docs/core/integration-quality-scale/checklist/
#
# Manifest declares `quality_scale: platinum` as a target. Each rule is
# tracked here with status `done` / `todo` / `exempt`. The integration
# becomes truly Platinum-compliant once every rule is `done` or has a
# documented `exempt` reason. Honest by design.

rules:
  # ---- Bronze ---------------------------------------------------------
  action-setup:
    status: exempt
    comment: >-
      The two services this integration exposes (`track_trip`,
      `untrack_trip`) are entity-services registered in the sensor
      platform's `async_setup_entry`. The rule's intent (services live
      at integration boot, not per-entity) is satisfied because the
      services are registered once for the platform.
  appropriate-polling: done
  brands: done
  common-modules: done
  config-flow-test-coverage: todo
  config-flow: done
  data_description: done
  dependency-transparency: done
  docs-actions: todo
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  entity-event-setup:
    status: exempt
    comment: >-
      Entities are CoordinatorEntity-based; HA wires the coordinator
      listeners in/out via the standard CoordinatorEntity lifecycle
      hooks, no custom event-subscription work needed.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: todo
  test-before-setup:
    status: exempt
    comment: >-
      We deliberately use `async_refresh` (which never raises) instead
      of `async_config_entry_first_refresh`. A transient NS API outage
      on first boot would otherwise put the whole hub in setup_retry
      and every NS Reisadvies card would render "Configuration error"
      until NS recovers. Graceful degradation (the sensor reports
      "No trips" until the next periodic refresh succeeds) is a
      better UX trade-off for a cloud-polling integration. Documented
      in `__init__.py` next to the call-site.
  unique-config-entry: done

  # ---- Silver ---------------------------------------------------------
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow: done
  test-coverage: todo

  # ---- Gold -----------------------------------------------------------
  devices: done
  diagnostics: done
  discovery-update-info:
    status: exempt
    comment: Cloud polling integration — no local discovery to update.
  discovery:
    status: exempt
    comment: >-
      NS Reisadvies polls a cloud API; there is nothing on the local
      network to discover.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices:
    status: exempt
    comment: >-
      The integration does not pair with physical devices; it exposes
      one sensor per configured route.
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: exempt
    comment: >-
      Routes are added by the user via the subentry flow ("Add
      route"), which is the closest analogue. There is no
      auto-discovery feed of new routes.
  entity-category:
    status: exempt
    comment: >-
      The single sensor per route is the integration's primary
      entity. None of the EntityCategory values
      (DIAGNOSTIC / CONFIG) describe it appropriately.
  entity-device-class:
    status: exempt
    comment: >-
      The state value is an ISO timestamp string ("planned departure
      of next trip"). HA has no SensorDeviceClass that fits this
      semantic exactly. SensorDeviceClass.TIMESTAMP would force a
      datetime conversion and lose the "Data available" / "No trips"
      placeholder states.
  entity-disabled-by-default:
    status: exempt
    comment: >-
      One entity per user-configured route — none of them are
      noisy or niche enough to default-disable.
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow: done
  repair-issues:
    status: exempt
    comment: >-
      The main user-fixable issue (NS API key revoked / rotated) is
      already handled by the Silver-tier reauthentication flow which
      surfaces a UI prompt automatically. Other errors (composition
      404s, transient NS API outages) are non-actionable for the
      user and are surfaced via edge-detection log messages rather
      than as Repair issues.
  stale-devices:
    status: exempt
    comment: >-
      "Devices" here are routes the user explicitly added; they are
      removed by removing the subentry.

  # ---- Platinum -------------------------------------------------------
  async-dependency: done
  inject-websession: done
  strict-typing: todo
