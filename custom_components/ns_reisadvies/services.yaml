# Service schema only — human-readable text comes from strings.json /
# translations/<lang>.json. Field names, descriptions and the service
# titles themselves are localised via the standard Home Assistant
# translation system.
track_trip:
  target:
    entity:
      integration: ns_reisadvies
      domain: sensor
  fields:
    ctx_recon:
      required: true
      example: "¶HKI¶T¶F=8400621@O=Amsterdam Centraal..."
      selector:
        text:

untrack_trip:
  target:
    entity:
      integration: ns_reisadvies
      domain: sensor
  fields:
    ctx_recon:
      required: true
      example: "¶HKI¶T¶F=8400621@O=Amsterdam Centraal..."
      selector:
        text:

# v2.15.5: manual force-rebuild of the cached ProRail rail-network
# GeoJSON. Useful when the live train map shows straight-line routes
# (an indication that the cache is missing or stale, usually because
# the public ProRail endpoint had a transient outage during the
# scheduled refresh).
refresh_rail_cache: {}
