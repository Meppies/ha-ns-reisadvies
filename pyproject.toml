[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.mypy]
# 3.13 because Home Assistant's own config_entries.py uses PEP 696
# type-parameter defaults, which mypy only accepts when targeting 3.13+.
python_version = "3.13"
strict = true
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_ignores = false
exclude = ["tests/"]

# Home Assistant's runtime classes (DataUpdateCoordinator, ConfigFlow,
# OptionsFlow, ConfigSubentryFlow, SensorEntity, …) and a number of HA
# decorators (`@callback`, `@websocket_api.websocket_command`,
# `@websocket_api.async_response`) are not fully typed in the public
# ``homeassistant`` distribution — mypy --strict sees them as ``Any``
# and complains about subclassing-Any and decorator-untyped issues.
# Suppressing those two error codes integration-wide is the standard
# pattern HA-core itself uses for custom-component packages.
[[tool.mypy.overrides]]
module = "custom_components.ns_reisadvies.*"
# `misc`, `untyped-decorator`, `call-arg` — see comment above.
# `attr-defined` and `name-defined` are also pure HA-stub fallout:
# `homeassistant.components.websocket_api` and
# `homeassistant.components.lovelace` don't declare an explicit
# `__all__`, so mypy --strict refuses access to their public
# constants and helpers (`websocket_command`, `async_response`,
# `ActiveConnection`, `DOMAIN`). HA core itself works around this
# with the same suppressions in its custom-component test infra.
disable_error_code = [
    "misc",
    "untyped-decorator",
    "call-arg",
    "attr-defined",
    "name-defined",
]
